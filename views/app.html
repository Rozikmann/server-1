<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Парикмахерская</title>
<style>
  :root { --bg-top:#efe6fb; --bg-bottom:#fbe9f3; --card:#fff; --ink:#2b1d44; --muted:#6f6590; --brand:#6d2fc7; --line:#e3daf3; --soft:#f1eaff; --error:#c0264b; --ok:#1f9d55; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { min-height: 100%; }
  body { margin:0; min-height:100vh; color:var(--ink);
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding: env(safe-area-inset-top,0px) 16px 0; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 0 170px; }
  header { margin-bottom: 14px; display:flex; justify-content:space-between; align-items:flex-start; }
  .calbtn { border:0; padding:4px; color:var(--brand); }
  .calbtn svg { width:28px; height:28px; display:block; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:18px; margin:0 0 12px; }
  .who { color:var(--muted); font-size:14px; margin-top:2px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:0 2px 12px rgba(109,47,199,.08); }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); padding:8px 12px; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; width:100%; padding:12px; }
  button.danger { color:var(--error); }
  input, select, textarea { font:inherit; font-size:16px; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); margin-bottom:8px; }
  select option { color:#222; }
  textarea { resize:vertical; min-height:70px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .row:first-child { border-top:0; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:13px; color:var(--error); margin-left:6px; }
  .msg { min-height:20px; font-size:14px; color:var(--error); margin:4px 0; }
  .empty { color:var(--muted); font-size:15px; padding:8px 0; }
  .muted { color:var(--muted); font-size:14px; }

  /* сегменты и навигация по датам */
  .seg { display:flex; gap:4px; background:var(--soft); border-radius:12px; padding:3px; margin-bottom:12px; }
  .seg button { flex:1; border:0; border-radius:9px; padding:8px 4px; color:var(--muted); }
  .seg button.on { background:var(--brand); color:#fff; font-weight:600; }
  .datebar { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .datebar .lbl { flex:1; border:0; font-weight:600; font-size:16px; padding:8px 0; }
  .datebar .arr { border:0; font-size:26px; line-height:1; padding:4px 14px; color:var(--brand); }
  .filters { position:fixed; left:50%; transform:translateX(-50%); width:min(100%,520px); bottom:calc(57px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px; padding:8px 16px; z-index:6; background:linear-gradient(to bottom, transparent, var(--bg-bottom) 35%); }
  .filters input { flex:1.4; margin:0; background:var(--card); box-shadow:0 2px 8px rgba(109,47,199,.08); }
  .filters select { flex:1; margin:0; background:var(--card); box-shadow:0 2px 8px rgba(109,47,199,.08); }

  /* день: шкала времени */
  .tl { position:relative; margin:8px 0 12px; }
  .tl .hr { position:absolute; left:0; right:0; border-top:1px solid var(--line); }
  .tl .hr span { position:absolute; top:-9px; left:0; background:transparent; font-size:13px; color:var(--muted); width:44px; }
  .ev { position:absolute; border-radius:12px; padding:8px 12px; overflow:hidden; cursor:pointer; border-left:4px solid; font-size:13px; line-height:1.35; color:#2b1d44; box-shadow:0 1px 3px rgba(43,29,68,.08); }
  .ev b { display:block; font-size:15px; padding-right:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev .sub { color:#4a3d6b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev a { position:absolute; right:10px; top:8px; color:var(--brand); display:flex; }
  .ev a svg { width:18px; height:18px; }
  .tl::before { content:''; position:absolute; left:46px; top:0; bottom:0; width:1px; background:var(--line); }

  /* список записей (неделя/месяц) */
  .item { color:#2b1d44; display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:10px; border-left:4px solid; margin-bottom:6px; cursor:pointer; }
  .item .t { font-weight:600; min-width:46px; font-size:15px; }
  .item .n { font-size:15px; font-weight:600; }
  .item .s { font-size:13px; color:#4a3d6b; }
  .dayhead { display:flex; justify-content:space-between; align-items:center; margin:12px 0 6px; font-weight:600; cursor:pointer; }

  /* месяц */
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; margin-bottom:8px; }
  .grid .wd { font-size:12px; color:var(--muted); padding:4px 0; }
  .grid button { border:0; padding:8px 0 10px; border-radius:50%; aspect-ratio:1; position:relative; font-size:15px; }
  .grid button.out { color:var(--muted); opacity:.55; }
  .grid button.today { outline:1px solid var(--brand); }
  .grid button.sel { background:var(--brand); color:#fff; }
  .grid button i { position:absolute; left:50%; bottom:5px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--brand); }
  .grid button.sel i { background:#fff; }

  .fab { position:fixed; right:max(16px, calc(50% - 244px)); bottom:calc(132px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:50%;
    background:var(--brand); color:#fff; border:0; font-size:32px; line-height:1; padding:0; box-shadow:0 6px 18px rgba(109,47,199,.4); z-index:5; }

  /* клиенты */
  .cl { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; }
  .cl:first-child { border-top:0; }
  .ava { width:38px; height:38px; border-radius:50%; background:var(--soft); color:var(--brand); display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
  .cl .info { flex:1; min-width:0; }
  .cl .info b { display:block; }
  .cl .chev { color:var(--muted); font-size:20px; }

  /* статистика */
  .big { text-align:center; margin:14px 0 4px; }
  .big .v { font-size:34px; font-weight:700; }
  .delta { font-size:14px; font-weight:600; margin-top:2px; }
  .delta.up { color:var(--ok); } .delta.down { color:var(--error); }
  .chart { display:flex; align-items:flex-end; gap:3px; height:130px; margin:14px 0 4px; }
  .chart .c { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
  .chart .bar { width:100%; background:var(--brand); border-radius:4px 4px 0 0; min-height:2px; }
  .chart .bar.z { opacity:.25; }
  .xl { display:flex; gap:3px; font-size:10px; color:var(--muted); margin-bottom:12px; }
  .xl span { flex:1; text-align:center; overflow:visible; white-space:nowrap; min-width:0; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .two div { border:1px solid var(--line); border-radius:12px; padding:12px; }
  .two small { color:var(--muted); display:block; }
  .two b { font-size:22px; }

  /* настройки */
  .srow { display:flex; align-items:center; gap:12px; width:100%; border:0; border-top:1px solid var(--line); border-radius:0; padding:14px 2px; text-align:left; }
  .srow:first-of-type { border-top:0; }
  .srow span { flex:1; }
  .srow .chev { color:var(--muted); flex:none; }

  /* форма-шторка */
  .ov { position:fixed; inset:0; background:rgba(20,10,40,.5); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--bg-top); width:100%; max-width:520px; max-height:94vh; display:flex; flex-direction:column; border-radius:18px 18px 0 0; }
  .shead { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  .stitle { font-weight:700; }
  .lnk { border:0; background:none; color:var(--brand); padding:4px 2px; }
  .lnk.strong { font-weight:700; }
  .sbody { padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px)); overflow:auto; }
  .fld { display:block; margin-bottom:4px; }
  .fld span { display:block; font-size:13px; color:var(--muted); margin:6px 0 3px; }
  .hint { font-size:13px; color:var(--muted); margin:-2px 0 8px; }
  .two-in { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  nav { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom,0px); z-index:10; }
  nav .in { max-width:520px; margin:0 auto; display:flex; }
  nav button { flex:1; border:0; border-radius:0; background:none; padding:8px 2px 6px; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; }
  nav button svg { width:24px; height:24px; }
  nav button.on { color:var(--brand); font-weight:600; }
  nav button:focus-visible { outline:2px solid var(--brand); outline-offset:-2px; }
</style>
</head>
<body>
<datalist id="clientlist"></datalist>
<datalist id="servicelist"></datalist>

<div class="wrap">
  <div class="card" id="warn" hidden style="color:var(--error);font-weight:600"></div>
  <header>
    <div>
      <h1>Парикмахерская</h1>
      <div class="who" id="who"></div>
    </div>
    <button class="calbtn" id="gotoday" aria-label="Перейти к сегодняшнему дню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
  </header>

  <section id="tab-schedule">
    <div class="seg" id="vseg">
      <button data-v="day" class="on">День</button>
      <button data-v="week">Неделя</button>
      <button data-v="month">Месяц</button>
    </div>
    <div class="datebar">
      <button class="arr" id="prev" aria-label="Назад">‹</button>
      <button class="lbl" id="dlabel" title="Перейти к сегодняшнему дню"></button>
      <button class="arr" id="next" aria-label="Вперёд">›</button>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="Поиск по клиенту, услуге…" aria-label="Поиск">
      <select id="mf" aria-label="Мастер"></select>
    </div>
    <div id="sched"></div>
    <button class="fab" id="fab" aria-label="Новая запись">+</button>
  </section>

  <section id="tab-clients" hidden>
    <div class="card">
      <h2>Клиенты</h2>
      <input id="cq" type="search" placeholder="Поиск по имени или телефону" aria-label="Поиск клиента">
      <div id="clist"></div>
    </div>
    <button class="primary" id="addcl">Добавить клиента</button>
  </section>

  <section id="tab-staff" hidden>
    <div class="card">
      <h2>Добавить сотрудника</h2>
      <input id="nn" placeholder="Имя мастера (оно видно в расписании)" autocomplete="off">
      <input id="nl" placeholder="Логин для входа" autocapitalize="none" autocomplete="off" spellcheck="false">
      <input id="np" placeholder="Пароль (от 6 символов)" autocomplete="off">
      <button class="primary" id="add">Добавить сотрудника</button>
      <div class="msg" id="msg" role="alert"></div>
    </div>
    <div class="card">
      <h2>Сотрудники</h2>
      <div id="list"></div>
    </div>
  </section>

  <section id="tab-stats" hidden>
    <div class="seg" id="sseg">
      <button data-v="day">День</button>
      <button data-v="week">Неделя</button>
      <button data-v="month" class="on">Месяц</button>
    </div>
    <div class="datebar">
      <button class="arr" id="sprev" aria-label="Назад">‹</button>
      <div class="lbl" id="slabel" style="text-align:center;font-weight:600"></div>
      <button class="arr" id="snext" aria-label="Вперёд">›</button>
    </div>
    <div class="card" id="sbox"></div>
    <button class="primary" id="export">Экспорт отчёта (CSV)</button>
  </section>

  <section id="tab-settings" hidden>
    <div class="card" id="setbox"></div>
  </section>
</div>

<nav>
  <div class="in">
    <button data-tab="schedule" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Расписание
    </button>
    <button data-tab="clients">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Клиенты
    </button>
    <button data-tab="staff" id="navstaff" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.8.2 5 2.4 5 5.5"/></svg>
      Сотрудники
    </button>
    <button data-tab="stats" id="navstats" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V12M12 21V4M19 21v-6"/></svg>
      Статистика
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      Настройки
    </button>
  </div>
</nav>

<script>
  var isAdmin = false, meLogin = '', meName = '';
  var masters = [], mNames = {}, allClients = [], services = [];
  var PALETTE = [{ bg: '#cfe0fb', bd: '#3b82f6' }, { bg: '#e6cbfa', bd: '#9333ea' }, { bg: '#c9efd0', bd: '#22a447' }, { bg: '#fde3bf', bd: '#f59e0b' }, { bg: '#fbd5e7', bd: '#ec4899' }, { bg: '#c5eee9', bd: '#14b8a6' }];
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  var DEFAULT_SERVICES = ['Стрижка', 'Окрашивание', 'Стрижка бороды', 'Укладка'];

  /* ---------- утилиты ---------- */
  function api(method, url, body) {
    return fetch(url, {
      method: method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (r.status === 401) { location.reload(); throw new Error('auth'); }
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 403 && isAdmin) {
          alert('Вы вошли под другим аккаунтом. Страница обновится.');
          location.reload();
          throw new Error('role');
        }
        if (!r.ok) throw new Error(d.error || 'Ошибка');
        return d;
      });
    });
  }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function P(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(d) { return d.getFullYear() + '-' + P(d.getMonth() + 1) + '-' + P(d.getDate()); }
  function parse(s) { return new Date(s + 'T12:00:00'); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return fmt(d); }
  function addMonths(s, n) {
    var y = +s.slice(0, 4), m = +s.slice(5, 7) - 1, day = +s.slice(8, 10);
    var t = new Date(y, m + n, 1);
    var dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, dim));
    t.setHours(12);
    return fmt(t);
  }
  function mondayOf(s) { return addDays(s, -((parse(s).getDay() + 6) % 7)); }
  function monthStart(s) { return s.slice(0, 7) + '-01'; }
  function monthEnd(s) { return fmt(new Date(+s.slice(0, 4), +s.slice(5, 7), 0, 12)); }
  function todayStr() { return fmt(new Date()); }
  function toMin(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
  function endT(t, d) { var m = toMin(t) + d; return P(Math.floor(m / 60) % 24) + ':' + P(m % 60); }
  function mName(l) { return mNames[l] || l; }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
  function dayLabel(d) {
    var x = parse(d);
    return (d === todayStr() ? 'Сегодня, ' : WD[x.getDay()] + ', ') + x.getDate() + ' ' + MONTHS[x.getMonth()] + ' ' + x.getFullYear();
  }
  function shortDay(d) { var x = parse(d); return WD[x.getDay()] + ', ' + x.getDate() + ' ' + MONTHS[x.getMonth()]; }
  function weekLabel(s) {
    var a = parse(s), b = parse(addDays(s, 6));
    if (a.getMonth() === b.getMonth()) return a.getDate() + '–' + b.getDate() + ' ' + MONTHS[b.getMonth()] + ' ' + b.getFullYear();
    return a.getDate() + ' ' + MONTHS[a.getMonth()] + ' – ' + b.getDate() + ' ' + MONTHS[b.getMonth()];
  }
  function monthLabel(s) { return MONTHS_NOM[+s.slice(5, 7) - 1] + ' ' + s.slice(0, 4); }
  function masterColor(m) { var i = masters.indexOf(m); return PALETTE[(i < 0 ? 0 : i) % PALETTE.length]; }
  function download(name, text, mime) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- вкладки ---------- */
  function showTab(name) {
    ['schedule', 'clients', 'staff', 'stats', 'settings'].forEach(function (t) {
      $('tab-' + t).hidden = (t !== name);
    });
    var bs = document.querySelectorAll('nav button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-tab') === name);
    try { sessionStorage.setItem('tab', name); } catch (e) {}
    if (name === 'schedule') loadSchedule();
    if (name === 'clients') refreshClients().then(renderClients);
    if (name === 'staff') loadList();
    if (name === 'stats') loadStats();
    if (name === 'settings') renderSettings();
  }
  var navBtns = document.querySelectorAll('nav button');
  for (var ni = 0; ni < navBtns.length; ni++) {
    navBtns[ni].onclick = function () { showTab(this.getAttribute('data-tab')); };
  }

  /* ---------- шторка (общая форма) ---------- */
  function openSheet(title, saveText, bodyEl, onSave) {
    var ov = h('div', 'ov'), sh = h('div', 'sheet'), head = h('div', 'shead');
    var c = h('button', 'lnk', 'Отмена'), t = h('div', 'stitle', title), s = h('button', 'lnk strong', saveText);
    head.appendChild(c); head.appendChild(t); head.appendChild(s);
    var inner = h('div', 'sbody'), err = h('div', 'msg');
    err.setAttribute('role', 'alert');
    inner.appendChild(bodyEl); inner.appendChild(err);
    sh.appendChild(head); sh.appendChild(inner); ov.appendChild(sh);
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    var o = {
      close: function () { ov.remove(); document.body.style.overflow = ''; },
      err: function (m) { err.textContent = m || ''; }
    };
    c.onclick = o.close;
    s.onclick = function () { o.err(''); onSave(o); };
    ov.onclick = function (e) { if (e.target === ov) o.close(); };
    return o;
  }
  function field(parent, label, input) {
    var l = h('label', 'fld');
    l.appendChild(h('span', '', label));
    l.appendChild(input);
    parent.appendChild(l);
    return input;
  }
  function inp(type, val, ph) {
    var i = document.createElement('input');
    i.type = type; i.value = val === undefined ? '' : val;
    if (ph) i.placeholder = ph;
    return i;
  }

  /* ---------- данные: клиенты и услуги ---------- */
  function refreshClients() {
    return Promise.all([
      api('GET', '/api/clients'),
      api('GET', '/api/appointments?from=2000-01-01&to=2100-12-31')
    ]).then(function (r) {

    var a1 = h('div'); a1.appendChild(h('small', '', 'Клиентов')); a1.appendChild(h('b', '', String(Object.keys(clients).length)));
    var mins = cur_.reduce(function (s, a) { return s + a.duration; }, 0);
    var a2 = h('div'); a2.appendChild(h('small', '', 'Часов работы')); a2.appendChild(h('b', '', (Math.round(mins / 6) / 10).toLocaleString('ru-RU')));
    two.appendChild(a1); two.appendChild(a2); box.appendChild(two);

    if (n) {
      box.appendChild(h('div', 'muted', 'По мастерам'));
      var by = {};
      cur_.forEach(function (a) { by[a.master] = (by[a.master] || 0) + 1; });
      Object.keys(by).sort(function (x, y) { return by[y] - by[x]; }).forEach(function (m) {
        var row = h('div', 'row');
        row.appendChild(h('div', '', mName(m)));
        row.appendChild(h('div', 'muted', by[m] + ' зап.'));
        box.appendChild(row);
      });
    } else {
      box.appendChild(h('div', 'empty', 'За этот период записей нет.'));
    }
  }
  var sb = $('sseg').querySelectorAll('button');
  for (var si = 0; si < sb.length; si++) sb[si].onclick = function () {
    sv = this.getAttribute('data-v'); setSeg('sseg', sv); loadStats();
  };
  $('sprev').onclick = function () { sd = sShift(-1); loadStats(); };
  $('snext').onclick = function () { sd = sShift(1); loadStats(); };
  $('export').onclick = function () {
    function q(v) { return '"' + String(v === undefined ? '' : v).replace(/"/g, '""') + '"'; }
    var rows = [['Дата', 'Время', 'Клиент', 'Телефон', 'Услуга', 'Мастер', 'Длительность, мин', 'Примечание'].map(q).join(';')];
    statData.slice().sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); }).forEach(function (a) {
      rows.push([a.date, a.time, a.client, a.phone, a.service, mName(a.master), a.duration, a.note].map(q).join(';'));
    });
    download('otchet_' + statRange[0] + '_' + statRange[1] + '.csv', '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  };

  /* ---------- настройки ---------- */
  function srow(text, fn, danger, sub) {
    var b = h('button', 'srow' + (danger ? ' danger' : ''));
    var t = h('span', '', text);
    if (sub) { var d = h('small', '', sub); d.style.cssText = 'display:block;color:var(--muted);font-size:14px'; t.appendChild(d); }
    b.appendChild(t); b.appendChild(h('span', 'chev', '›'));
    b.onclick = fn; return b;
  }
  function renderSettings() {
    var box = $('setbox'); box.textContent = '';
    box.appendChild(h('h2', '', 'Настройки'));
    if (isAdmin) {
      box.appendChild(srow('Моё имя в расписании', function () {
        var body = h('div');
        var n = field(body, 'Имя мастера', inp('text', meName));
        openSheet('Моё имя', 'Сохранить', body, function (sh) {
          api('POST', '/api/admin-name', { name: n.value }).then(function (d) {
            meName = d.name; sh.close();
            $('who').textContent = 'Администратор: ' + meName;
            loadMasters().then(renderSettings);
          }).catch(function (e) { sh.err(e.message); });
        });
      }, false, meName));
    }
    box.appendChild(srow('Выйти', function () { api('POST', '/api/logout').then(function () { location.reload(); }); }, true));
  }

  /* ---------- старт ---------- */
  function loadMasters() {
    return api('GET', '/api/masters').then(function (m) {
      m = m.map(function (x) { return typeof x === 'string' ? { login: x, name: x } : x; });
      masters = m.map(function (x) { return x.login; });
      mNames = {};
      m.forEach(function (x) { mNames[x.login] = x.name || x.login; });
      var s = $('mf'); s.textContent = '';
      var all = document.createElement('option'); all.value = ''; all.textContent = 'Все мастера'; s.appendChild(all);
      masters.forEach(function (x) { var o = document.createElement('option'); o.value = x; o.textContent = mName(x); s.appendChild(o); });
      s.value = mf;
    });
  }
  api('GET', '/api/me').then(function (me) {
    isAdmin = me.role === 'admin';
    meLogin = me.login;
    meName = me.name || me.login;
    if (me.version !== 4) {
      var w = $('warn');
      w.textContent = 'Сервер не обновлён: на нём старый server.js. Загрузите новый server.js и admin.js, перезапустите сервис (на Render: Manual Deploy), затем обновите страницу. Пока этого не сделано, имена и часть функций работать не будут.';
      w.hidden = false;
    }
    $('who').textContent = (isAdmin ? 'Администратор: ' : 'Вы вошли как ') + meName;
    $('navstaff').hidden = !isAdmin;
    $('navstats').hidden = !isAdmin;
    var last = 'schedule';
    try { last = sessionStorage.getItem('tab') || 'schedule'; } catch (e) {}
    if ((last === 'staff' || last === 'stats') && !isAdmin) last = 'schedule';
    return loadMasters().catch(function () {
      masters = [meLogin]; mNames = {}; mNames[meLogin] = me.name || meLogin;
    }).then(function () {
      showTab(last);
      refreshClients().catch(function () {});
    });
  }).catch(function (e) {
    if (e.message !== 'auth') $('sched').textContent = 'Не удалось загрузить данные: ' + e.message + '. Обновите страницу.';
  });
</script>
</body>
</html>
